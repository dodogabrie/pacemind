# Deploy sul NUC, dietro il tunnel Cloudflare (trail.edoardogabrielli.com).
#   docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml \
#     -f docker/docker-compose.nuc.yml up -d --build
# TLS lo termina Cloudflare: nginx ascolta solo su 127.0.0.1:8094.
services:
  backend:
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - uploads:/app/data/uploads
    # 512M di base con 4 worker gunicorn va in OOM (visto 2026-09-24); il NUC ha 15G.
    deploy:
      resources:
        limits:
          memory: 1536M

  nginx:
    # nginx risolve "backend" solo all'avvio: se compose ricrea backend o frontend,
    # senza restart nginx resta sul vecchio IP e risponde 502.
    depends_on:
      backend:
        condition: service_started
        restart: true
      frontend:
        condition: service_started
        restart: true
    ports: !override
      - "127.0.0.1:8094:80"
    volumes: !override
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cloudflare-realip.conf:/etc/nginx/conf.d/00-realip.conf:ro

volumes:
  uploads:
