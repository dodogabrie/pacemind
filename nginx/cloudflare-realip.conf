# Solo deploy NUC (docker/docker-compose.nuc.yml): dietro il tunnel Cloudflare
# nginx vede ogni richiesta dal gateway Docker, e i limit_req diventerebbero un
# unico secchio per tutto il sito. Il vero client è in CF-Connecting-IP.
# Sicuro solo perché la porta ascolta su 127.0.0.1: da fuori l'header non arriva.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
