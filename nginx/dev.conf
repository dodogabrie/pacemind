server {
    listen 80;
    server_name localhost;

    client_max_body_size 16m;

    # SSE streaming endpoint — disable buffering
    location /api/agent/chat/stream {
        proxy_pass http://backend:5000/api/agent/chat/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding off;
    }

    # Activity-export uploads: a Garmin GDPR archive is hundreds of MB. The
    # request returns as soon as the file lands — the import itself is async —
    # so only the upload leg needs the bigger body and longer timeout.
    location /api/activities/import {
        client_max_body_size 512m;
        proxy_pass http://backend:5000/api/activities/import;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # Proxy API requests to Flask backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Vite HMR websocket
    location /ws {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Vite dev assets (HMR client, source files)
    location /@vite/ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /@fs/ {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }

    location /node_modules/ {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }

    location /src/ {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }

    # Everything else to Vite dev server (SPA)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
